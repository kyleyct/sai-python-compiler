<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAi Python Compiler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #0f3460; flex-shrink: 0; }
    header h1 { font-size: 1.1rem; color: #4fc3f7; }
    .badge { background: #0f3460; color: #4fc3f7; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }

    /* CSV Upload Area */
    .csv-panel { background: #0d1f35; border-bottom: 2px solid #0f3460; padding: 10px 16px; flex-shrink: 0; }
    .csv-panel-title { font-size: 0.75rem; color: #90caf9; margin-bottom: 8px; letter-spacing: 0.5px; }
    .csv-drop-zone { border: 2px dashed #1e5f8a; border-radius: 8px; padding: 14px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s; background: #0a1929; }
    .csv-drop-zone:hover, .csv-drop-zone.drag-over { border-color: #4fc3f7; background: #0f2a3d; }
    .csv-drop-zone .drop-icon { font-size: 1.8rem; flex-shrink: 0; }
    .csv-drop-zone .drop-text { flex: 1; }
    .csv-drop-zone .drop-text .main-text { font-size: 0.85rem; color: #c9d1d9; }
    .csv-drop-zone .drop-text .sub-text { font-size: 0.75rem; color: #6e7f8d; margin-top: 2px; }
    .csv-drop-zone .upload-btn { background: #1565c0; color: white; border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 0.82rem; font-weight: 600; white-space: nowrap; transition: background 0.2s; }
    .csv-drop-zone .upload-btn:hover { background: #1976d2; }
    .csv-file-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .csv-file-tag { background: #0f3460; border: 1px solid #1e5f8a; border-radius: 20px; padding: 3px 12px 3px 10px; font-size: 0.78rem; color: #4fc3f7; display: flex; align-items: center; gap: 6px; }
    .csv-file-tag .tag-info { color: #90caf9; font-size: 0.72rem; }
    .csv-file-tag .remove-btn { background: none; border: none; color: #f48771; cursor: pointer; font-size: 0.85rem; padding: 0; line-height: 1; }
    #csv-file-input { display: none; }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
    .toolbar button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: opacity 0.2s; }
    .toolbar button:hover { opacity: 0.85; }
    #btn-run { background: #4caf50; color: white; }
    #btn-reset { background: #f44336; color: white; }
    #btn-clear { background: #607d8b; color: white; }
    #btn-example1, #btn-example2, #btn-example3 { background: #0f3460; color: #4fc3f7; border: 1px solid #4fc3f7; }
    #status { margin-left: auto; font-size: 0.8rem; color: #90caf9; }

    /* Main layout */
    .main { display: flex; flex: 1; overflow: hidden; }
    .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #0f3460; }
    .panel-title { background: #0f3460; padding: 5px 14px; font-size: 0.78rem; color: #90caf9; letter-spacing: 0.5px; flex-shrink: 0; }
    #editor { flex: 1; background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; font-size: 0.88rem; border: none; outline: none; padding: 14px; resize: none; line-height: 1.6; tab-size: 4; }
    .output-panel { width: 45%; display: flex; flex-direction: column; }
    #console { flex: 1; background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; font-size: 0.82rem; padding: 14px; overflow-y: auto; white-space: pre-wrap; border-bottom: 1px solid #0f3460; }
    #result-area { height: 180px; overflow: auto; padding: 8px; background: #111; }
    #result-area table { border-collapse: collapse; width: 100%; font-size: 0.78rem; }
    #result-area th { background: #0f3460; color: #4fc3f7; padding: 5px 10px; text-align: left; }
    #result-area td { padding: 4px 10px; border-bottom: 1px solid #1e2a3a; color: #c9d1d9; }
    #result-area tr:hover td { background: #1a2535; }

    /* Message colours */
    .error { color: #f48771; }
    .success { color: #89d185; }
    .info { color: #4fc3f7; }
    .warn { color: #e5c07b; }

    /* Loading overlay */
    #loading-overlay { position: fixed; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 20px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #0f3460; border-top-color: #4fc3f7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #4fc3f7; font-size: 1rem; }

    /* SAi inject bar */
    #inject-area { background: #16213e; border-top: 1px solid #0f3460; padding: 7px 16px; display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: #90caf9; flex-shrink: 0; }
    #inject-code { flex: 1; background: #0d1117; color: #c9d1d9; border: 1px solid #0f3460; border-radius: 4px; padding: 4px 8px; font-size: 0.78rem; font-family: monospace; }
    #inject-area button { padding: 4px 12px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.78rem; }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">載入 Python 執行環境中 (Pyodide + NumPy + pandas)...</div>
</div>

<header>
  <h1>SAi Python Compiler</h1>
  <span class="badge">MVP v1.1</span>
  <span class="badge">Pyodide</span>
  <span class="badge">NumPy + pandas</span>
</header>

<!-- CSV Upload Panel -->
<div class="csv-panel">
  <div class="csv-panel-title">📂 CSV 資料上傳（可拖放多個檔案）</div>
  <div class="csv-drop-zone" id="csv-drop-zone">
    <div class="drop-icon">📄</div>
    <div class="drop-text">
      <div class="main-text">將 CSV 檔案拖放到此處，程式碼中直接用 <code style="color:#4fc3f7;background:#0f3460;padding:1px 5px;border-radius:3px;">pd.read_csv('你的檔名.csv')</code> 讀取</div>
      <div class="sub-text">支援多個 CSV 同時上傳 · 亦支援點擊按鈕選擇檔案</div>
    </div>
    <button class="upload-btn" id="btn-upload-csv">選擇 CSV 檔案</button>
  </div>
  <div class="csv-file-list" id="csv-file-list"></div>
  <input type="file" id="csv-file-input" accept=".csv" multiple />
</div>

<div class="toolbar">
  <button id="btn-run">▶ Run</button>
  <button id="btn-reset">⟳ Reset Runtime</button>
  <button id="btn-clear">✕ Clear Output</button>
  <button id="btn-example1">Hello World</button>
  <button id="btn-example2">NumPy 示例</button>
  <button id="btn-example3">pandas 示例</button>
  <span id="status">初始化中...</span>
</div>

<div class="main">
  <div class="editor-panel">
    <div class="panel-title">PYTHON EDITOR</div>
    <textarea id="editor" spellcheck="false" placeholder="在此輸入或貼上 Python 程式碼..."></textarea>
  </div>
  <div class="output-panel">
    <div class="panel-title">CONSOLE OUTPUT</div>
    <div id="console"></div>
    <div class="panel-title">RESULT PREVIEW (DataFrame / Value)</div>
    <div id="result-area"></div>
  </div>
</div>

<div id="inject-area">
  <span>SAi 注入程式碼：</span>
  <input id="inject-code" type="text" placeholder="由 SAi LLM 自動填入的程式碼將顯示於此..." readonly />
  <button onclick="injectCode()">注入 Editor</button>
</div>

<script>
  let pyWorker = null;
  let workerReady = false;
  // Store uploaded CSV files: { filename: csvTextContent }
  const uploadedCSVs = {};

  // ── Logging ──────────────────────────────────────────
  function log(msg, cls = '') {
    const c = document.getElementById('console');
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    c.appendChild(line);
    c.scrollTop = c.scrollHeight;
  }

  // ── Worker ───────────────────────────────────────────
  function initWorker() {
    if (pyWorker) pyWorker.terminate();
    workerReady = false;
    document.getElementById('status').textContent = '載入中...';
    pyWorker = new Worker('py-worker.js', { type: 'module' });

    pyWorker.onmessage = (e) => {
      const { type, data } = e.data;
      if (type === 'ready') {
        workerReady = true;
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('status').textContent = '✓ 就緒';
        log('✓ Python 環境就緒 (NumPy + pandas 已載入)', 'success');
        // Re-send any already-uploaded CSVs after reset
        Object.entries(uploadedCSVs).forEach(([name, content]) => {
          pyWorker.postMessage({ type: 'upload_csv', filename: name, content });
        });
      } else if (type === 'boot_error') {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('status').textContent = '✗ 載入失敗';
        log('✗ 環境載入失敗：' + data, 'error');
      } else if (type === 'csv_loaded') {
        log('✓ CSV 已載入虛擬檔案系統：' + data, 'success');
      } else if (type === 'stdout') {
        log(data);
      } else if (type === 'stderr') {
        log(data, 'error');
      } else if (type === 'result') {
        document.getElementById('status').textContent = '✓ 執行完成';
        if (data && data.type === 'dataframe') {
          document.getElementById('result-area').innerHTML = data.html;
        } else if (data && data.value !== undefined) {
          document.getElementById('result-area').innerHTML =
            '<pre style="color:#89d185;padding:10px;">' + data.value + '</pre>';
        } else {
          document.getElementById('result-area').innerHTML = '';
        }
      } else if (type === 'error') {
        document.getElementById('status').textContent = '✗ 執行錯誤';
        log(data, 'error');
      } else if (type === 'done') {
        if (document.getElementById('status').textContent === '執行中...') {
          document.getElementById('status').textContent = '✓ 完成';
        }
      }
    };

    pyWorker.onerror = (e) => {
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('status').textContent = '✗ Worker 錯誤';
      log('Worker 錯誤：' + e.message, 'error');
    };
  }

  // ── CSV Upload Logic ──────────────────────────

  function handleCSVFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.name.endsWith('.csv')) {
        log('⚠ 只接受 .csv 格式：' + file.name, 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = ev.target.result;
        uploadedCSVs[file.name] = content;
        renderFileList();
        if (workerReady) {
          pyWorker.postMessage({ type: 'upload_csv', filename: file.name, content });
        }
        log('✓ 已上傳：' + file.name + ' (' + content.split('\n').length + ' 行)', 'success');
      };
      reader.readAsText(file, 'UTF-8');
    });
  }

  function renderFileList() {
    const list = document.getElementById('csv-file-list');
    list.innerHTML = '';
    Object.entries(uploadedCSVs).forEach(([name, content]) => {
      const rows = content.split('\n').filter(r => r.trim()).length;
      const cols = (content.split('\n')[0] || '').split(',').length;
      const tag = document.createElement('div');
      tag.className = 'csv-file-tag';
      tag.innerHTML = `
        <span>📄 ${name}</span>
        <span class="tag-info">${rows - 1} 行 × ${cols} 欄</span>
        <button class="remove-btn" title="移除此檔案" onclick="removeCSV('${name}')">✕</button>
      `;
      list.appendChild(tag);
    });
  }

  function removeCSV(name) {
    delete uploadedCSVs[name];
    renderFileList();
    log('已移除：' + name, 'info');
  }

  // Drag & Drop
  const dropZone = document.getElementById('csv-drop-zone');
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleCSVFiles(e.dataTransfer.files);
  });

  // Click to upload
  document.getElementById('btn-upload-csv').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('csv-file-input').click();
  });
  document.getElementById('csv-drop-zone').addEventListener('click', () => {
    document.getElementById('csv-file-input').click();
  });
  document.getElementById('csv-file-input').addEventListener('change', (e) => {
    handleCSVFiles(e.target.files);
    e.target.value = '';
  });

  // ── Run / Reset / Clear ───────────────────────

  document.getElementById('btn-run').onclick = () => {
    if (!workerReady) { log('環境尚未就緒，請稍候...', 'info'); return; }
    const code = document.getElementById('editor').value.trim();
    if (!code) { log('請輸入程式碼', 'info'); return; }
    document.getElementById('status').textContent = '執行中...';
    log('--- 執行開始 ---', 'info');
    pyWorker.postMessage({ type: 'run', code });
  };

  document.getElementById('btn-reset').onclick = () => {
    log('--- 重設 Runtime ---', 'info');
    document.getElementById('result-area').innerHTML = '';
    initWorker();
  };

  document.getElementById('btn-clear').onclick = () => {
    document.getElementById('console').innerHTML = '';
    document.getElementById('result-area').innerHTML = '';
  };

  // Tab key in editor
  document.getElementById('editor').addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = e.target.selectionStart;
      e.target.value = e.target.value.substring(0, s) + '    ' + e.target.value.substring(e.target.selectionEnd);
      e.target.selectionStart = e.target.selectionEnd = s + 4;
    }
  });

  // ── Examples ─────────────────────────────────

  const examples = {
    'btn-example1': `# Hello World\nprint("Hello from SAi Python Compiler!")\nprint("NumPy version:", __import__('numpy').__version__)\nprint("pandas version:", __import__('pandas').__version__)`,
    'btn-example2': `import numpy as np\n\narr = np.array([1, 2, 3, 4, 5])\nprint("Array:", arr)\nprint("Mean:", np.mean(arr))\nprint("Std:", np.std(arr))\nprint("Sum:", np.sum(arr))\n\nmatrix = np.random.rand(3, 3)\nprint("\\nRandom 3x3 matrix:\\n", matrix)`,
    'btn-example3': `import pandas as pd\nimport numpy as np\n\n# 如已上傳 CSV，可用：\n# df = pd.read_csv('你的檔名.csv')\n\n# 示例：建立 DataFrame\ndata = {\n    '學生': ['Alice', 'Bob', 'Charlie', 'Diana'],\n    '數學': [85, 92, 78, 96],\n    '英文': [88, 75, 91, 83],\n    '科學': [90, 88, 85, 79]\n}\ndf = pd.DataFrame(data)\ndf['平均分'] = df[['數學', '英文', '科學']].mean(axis=1).round(1)\nprint(df.to_string())\nresult = df`
  };

  ['btn-example1', 'btn-example2', 'btn-example3'].forEach(id => {
    document.getElementById(id).onclick = () => {
      document.getElementById('editor').value = examples[id];
    };
  });

  // ── SAi Inject ────────────────────────────────

  function injectCode() {
    const injected = document.getElementById('inject-code').value;
    if (injected) {
      document.getElementById('editor').value = injected;
      log('✓ 程式碼已由 SAi 注入', 'success');
    }
  }

  window.injectCode = injectCode;
  window.removeCSV = removeCSV;

  initWorker();
</script>
</body>
</html>
